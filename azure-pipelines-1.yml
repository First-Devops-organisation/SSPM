trigger:
  branches:
    include:
      - none  # Replace with your actual branch name or trigger condition

pool:
  vmImage: 'windows-latest'

variables:
  group: JsonVariableGrp  # Reference a variable group named 'JsonVariableGrp'
  RestoreBuildProjects: '**/*.csproj'   # Default value for projects to restore
  TestProjects: '**/*[Tt]ests/*.csproj'  # Default value for test projects

jobs:
- job: BuildTestPublish
  displayName: 'Build, Test, and Publish'
  steps:
  - task: DotNetCoreCLI@2
    displayName: Restore
    inputs:
      command: restore
      projects: '$(RestoreBuildProjects)'

  - task: DotNetCoreCLI@2
    displayName: Build
    inputs:
      command: build
      projects: '$(RestoreBuildProjects)'
      arguments: '--configuration $(BuildConfiguration)'

  - task: DotNetCoreCLI@2
    displayName: Test
    inputs:
      command: test
      projects: '$(TestProjects)'
      arguments: '--configuration $(BuildConfiguration) /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura'

  - task: PublishCodeCoverageResults@1
    displayName: 'Publish code coverage'
    inputs:
      codeCoverageTool: 'Cobertura'
      summaryFileLocation: '**/*.cobertura.xml'

  - task: replacetokens@6
    displayName: 'Replace tokens in configuration files'
    inputs:
      sources: '**/appsettings*.json'

  - task: DotNetCoreCLI@2
    displayName: Publish
    inputs:
      command: publish
      publishWebProjects: true
      arguments: '--configuration $(BuildConfiguration) --output $(build.artifactstagingdirectory)'
      zipAfterPublish: true

  - task: PublishBuildArtifacts@1
    displayName: 'Publish Artifact'
    inputs:
      PathtoPublish: '$(build.artifactstagingdirectory)'
    condition: succeededOrFailed()
