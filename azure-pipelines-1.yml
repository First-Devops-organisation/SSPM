trigger:
  branches:
    include:
      - none  # Replace with your actual branch name or trigger condition

pool:
  vmImage: 'windows-latest'

variables:
  group: JsonVariableGrp  # Reference a variable group named 'JsonVariableGrp'
  RestoreBuildProjects: '**/*.csproj'   # Default value for projects to restore
  TestProjects: '**/*[Tt]ests/*.csproj'  # Default value for test projects

jobs:
- job: BuildTestPublish
  displayName: 'Build, Test, and Publish'
  steps:
  - task: DotNetCoreCLI@2
    displayName: Restore
    inputs:
      command: restore
      projects: '$(RestoreBuildProjects)'

  - task: DotNetCoreCLI@2
    displayName: Build
    inputs:
      command: build
      projects: '$(RestoreBuildProjects)'
      arguments: '--configuration $(BuildConfiguration)'

  - task: DotNetCoreCLI@2
    displayName: Test
    inputs:
      command: test
      projects: '$(TestProjects)'
      arguments: '--configuration $(BuildConfiguration) /p:CollectCoverage=true /p:CoverletOutputFormat=cobertura'

  - task: PublishCodeCoverageResults@1
    displayName: 'Publish code coverage'
    inputs:
      codeCoverageTool: 'Cobertura'
      summaryFileLocation: '**/*.cobertura.xml'

  - task: ExtractFiles@1
    displayName: 'Extract Files'
    inputs:
      archiveFilePatterns: '$(Pipeline.Workspace)/**/*.zip'  # Path to your ZIP files
      destinationFolder: '$(Pipeline.Workspace)/application'  # Destination folder for extracted files
      cleanDestinationFolder: true  # Clean destination folder before extraction
      overwriteExistingFiles: false  # Do not overwrite existing files

    # Step 2: Replace tokens in JSON files
  - task: replacetokens@5
    displayName: 'Replace Tokens'
    inputs:
      targetFiles: '$(Pipeline.Workspace)/application/appsettings*.json'  # Target JSON files for token replacement
      encoding: 'auto'  # Encoding type of the files
      tokenPattern: 'default'  # Token pattern to replace
      writeBOM: true  # Write BOM (Byte Order Mark)
      actionOnMissing: 'warn'  # Action if files are missing
      keepToken: false  # Keep or remove tokens after replacement
      actionOnNoFiles: 'continue'  # Action if no files are found
      enableTransforms: false  # Enable transformation
      enableRecursion: false  # Enable recursion in directory search
      useLegacyPattern: false  # Use legacy token pattern
      enableTelemetry: true  # Enable telemetry for the task

    # Step 3: Delete existing ZIP files
  - task: DeleteFiles@1
    displayName: 'Delete ZIP Files'
    inputs:
      SourceFolder: '$(Pipeline.Workspace)/drop/'  # Folder containing ZIP files to delete
      Contents: '*.zip'  # File pattern to match ZIP files

    # Step 4: Archive modified files into a new ZIP file
  - task: ArchiveFiles@2
    displayName: 'Archive Modified Files'
    inputs:
      rootFolderOrFile: '$(Pipeline.Workspace)/application/'  # Root folder of files to archive
      includeRootFolder: false  # Do not include root folder in the archive
      archiveType: 'zip'  # Type of archive (e.g., zip)
      archiveFile: '$(Pipeline.Workspace)/drop/$(Build.BuildId).zip'  # Path and name of the new archive
      replaceExistingArchive: true  # Replace existing archive if it exists




  - task: DotNetCoreCLI@2
    displayName: Publish
    inputs:
      command: publish
      publishWebProjects: true
      arguments: '--configuration $(BuildConfiguration) --output $(build.artifactstagingdirectory)'
      zipAfterPublish: true

  - task: PublishBuildArtifacts@1
    displayName: 'Publish Artifact'
    inputs:
      PathtoPublish: '$(build.artifactstagingdirectory)'
    condition: succeededOrFailed()
