trigger:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

steps:
- task: UsePythonVersion@0
  inputs:
    versionSpec: '3.12'
    addToPath: true

- script: |
    python -m pip install --upgrade pip
    pip install monkey365
  displayName: 'Install Monkey365'

- script: |
    monkey365 scan --config C:\Users\Nimish.Mulkalwar\Desktop\monkey.ps1
  displayName: 'Run Monkey365 Scan'

- task: PublishPipelineArtifact@1
  inputs:
    targetPath: '$(Pipeline.Workspace)/scan-results'
    artifact: 'scan-results'
  displayName: 'Publish Scan Results'
