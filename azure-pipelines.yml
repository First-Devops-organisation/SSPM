trigger:
  branches:
    include:
      - main  # Adjust as needed

pool:
  vmImage: 'windows-latest'

steps:
- task: PowerShell@2
  displayName: 'Install and configure Monkey365'
  inputs:
    targetType: 'inline'
    script: |
      # Ensure execution policy allows script execution
      Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass
      Install-PackageProvider -Name NuGet -Force
      # Install or update NuGet module
      Install-Module -Name NuGet -Force -Scope CurrentUser -AllowClobber

      # Install or update PowerShellGet module
      Install-Module -Name PowerShellGet -Force -Scope CurrentUser -AllowClobber

      # Unregister the PSGallery repository to avoid potential conflicts
      Unregister-PSRepository -Name PSGallery -ErrorAction SilentlyContinue

      # Register the default PowerShell Gallery repository
      Register-PSRepository -Default

      # Install the 'monkey365' module from the PowerShell Gallery
      Install-Module monkey365 -Scope CurrentUser -Force

      # Unblock files in the monkey365 directory (if needed)
      Get-ChildItem -Path 'C:\monkey365' -Recurse | Unblock-File

      # Import the 'monkey365' module
      Import-Module monkey365

      # Define Monkey365 parameters
      $param = @{
          Instance        = 'Azure'
          Analysis        = 'All'
          PromptBehavior  = 'SelectAccount'
          Subscriptions   = 'c695dbea-3557-43d1-97d7-92b5c140e941'
          TenantID        = 'd8e705e3-abdd-4b36-8f17-c5beb4465d33'
          ExportTo        = 'HTML'
      }

      # Invoke Monkey365 analysis
      Invoke-Monkey365 @param
