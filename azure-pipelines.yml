# Azure DevOps Pipeline YAML
trigger:
- none
 
pool:
  vmImage: 'windows-latest'
 
steps:
- task: PowerShell@2
  inputs:
    targetType: 'inline'
    script: |
      # Define the Open API URL
      $apiUrl = "https://api.uptimerobot.com/v2/getMonitors?api_key=u2675880-afa87a2ccdf232fe87496cd0"
      
      # Make the API call (POST request)
      $response = Invoke-RestMethod -Uri $apiUrl -Method POST

      curl -X POST -H "Content-Type: application/x-www-form-urlencoded" -H "Cache-Control: no-cache" -d 'api_key=u2675880-afa87a2ccdf232fe87496cd0&format=json&logs=1' "https://api.uptimerobot.com/v2/getMonitors"
      
      # Output the response in JSON format
      $response | ConvertTo-Json
