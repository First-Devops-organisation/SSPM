trigger:
  branches:
    include:
      - main  # Adjust as needed

pool:
  vmImage: 'windows-latest'

steps:
- task: PowerShell@2
  inputs:
    targetType: 'inline'
    script: |
      # Ensure execution policy allows script execution
      Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass

      Install-Module -Name monkey365 -Scope CurrentUser

      # Import required modules
      try {
          Import-Module -Name monkey365 -ErrorAction Stop
      } catch {
          Write-Error "Failed to import module 'monkey365'. Please ensure the module is installed."
          exit 1
      }

      # Define parameters
      $param = @{
          Instance        = 'Azure'
          Analysis        = 'All'
          PromptBehavior  = 'SelectAccount'
          Subscriptions   = 'c695dbea-3557-43d1-97d7-92b5c140e941'
          TenantID        = 'd8e705e3-abdd-4b36-8f17-c5beb4465d33'
          ExportTo        = 'HTML'
      }

      # Invoke the command with parameters
      try {
          $assets = Invoke-Monkey365 @param
      } catch {
          Write-Error "Failed to invoke Monkey365 command: $_"
          exit 1
      }

      # If you need to unblock files
      try {
          Get-ChildItem -Path 'C:\monkey365' -Recurse | Unblock-File -ErrorAction Stop
      } catch {
          Write-Error "Failed to unblock files: $_"
          exit 1
      }

      # Successful execution
      Write-Output "Monkey365 analysis completed successfully."
